# API + REGRESIONES EXTREMO A EXTREMO, CONTRA POSTGRESQL 16 REAL
#
# POR QUE UN ARCHIVO NUEVO Y NO UNA EDICION DE tests.yml: el workflow existente
# tiene 501 lineas y tres jobs que hoy pasan. Un cambio delicado de CI que se
# mete en medio puede romper lo que ya funciona y eso se descubre despues del
# merge. Un archivo aparte no puede romper nada: si este falla, falla solo.
#
# QUE HUECO CIERRA: la auditoria del 15-sep midio que el CI pasaba VERDE sin
# ejecutar `test_api.py`, sin `guard_esquema.py` y sin tocar `PostgresAlmacen`.
# O sea que el login podia estar roto -- y lo estaba -- con el CI en verde. Un
# CI que no puede dar rojo por el defecto que hay en el arbol no es un CI.
#
# POSTGRESQL 16 A PROPOSITO: la corrida de brain-env uso 17.11 porque el 16
# embebido no traia las extensiones. 17 no es equivalente a 16 y no se declara
# como tal: la version del CI es la que manda.
name: api-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/api-e2e.yml"
  push:
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/api-e2e.yml"

permissions:
  contents: read

jobs:
  api-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: custos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/custos
      DATABASE_URL_APP: postgresql://custos_app:CAMBIAR_EN_PRODUCCION@localhost:5432/custos
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: REGRESION - el falsador rechaza errores de preparacion
        run: python3 backend/test_falsador_caso.py

      - name: instalar cliente y driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          python3 -m pip install --quiet 'psycopg[binary]'

      - name: version del motor (queda escrita, no se asume)
        run: psql -h localhost -U postgres -d custos -tAc "SELECT version()"

      - name: aplicar el esquema
        run: |
          set -uo pipefail
          psql -h localhost -U postgres -d custos -v ON_ERROR_STOP=1 -f infra/init.sql

      - name: CONTROL DEL INSTRUMENTO - el rol de la app no tiene atajos
        run: |
          set -uo pipefail
          # Si custos_app fuera superusuario o tuviera BYPASSRLS, TODO lo que
          # sigue seria un verde vacio. Se mide antes de creer en nada.
          psql -h localhost -U postgres -d custos -tAc "SELECT rolname, rolsuper, rolbypassrls FROM pg_roles WHERE rolname='custos_app'"
          N=$(psql -h localhost -U postgres -d custos -tAc "SELECT count(*) FROM pg_roles WHERE rolname='custos_app' AND (rolsuper OR rolbypassrls)")
          echo "roles con atajo: ${N}"
          test "${N}" = "0"

      - name: guard del esquema
        run: python3 backend/guard_esquema.py

      - name: suite de API
        run: python3 backend/test_api.py

      - name: RLS con PostgresAlmacen real
        run: python3 backend/test_rls.py

      - name: REGRESIONES e2e desde login REAL (sin sesiones inyectadas)
        run: python3 backend/test_regresiones_hitl.py

      - name: DECISION DEL TRIGGER - mide el ANTES y aplica la migracion
        run: |
          set -uo pipefail
          # Esta suite mide el defecto con el esquema base (el rol de la app
          # borrando un bufete entero), aplica
          # infra/2026-09-16-cierra-el-borrado-de-un-bufete.sql y vuelve a medir.
          # El control positivo del paso 1 es lo que hace que su verde no sea
          # vacio: si el defecto no existiera, ese paso daria rojo.
          python3 backend/test_borrado_bufete.py

      - name: GUARD - la migracion quedo aplicada de verdad
        run: |
          set -uo pipefail
          # Lee el catalogo, no el log de la suite anterior. Un log puede citar
          # su propio texto; pg_constraint e information_schema no.
          psql -h localhost -U postgres -d custos -tAc "SELECT confdeltype FROM pg_constraint WHERE conname='aprobaciones_tenant_id_fkey'"
          FK=$(psql -h localhost -U postgres -d custos -tAc "SELECT confdeltype FROM pg_constraint WHERE conname='aprobaciones_tenant_id_fkey'")
          echo "FK aprobaciones->tenants: ${FK} (r = RESTRICT)"
          test "${FK}" = "r"
          psql -h localhost -U postgres -d custos -tAc "SELECT string_agg(privilege_type,',' ORDER BY privilege_type) FROM information_schema.role_table_grants WHERE grantee='custos_app' AND table_name='tenants'"
          P=$(psql -h localhost -U postgres -d custos -tAc "SELECT string_agg(privilege_type,',' ORDER BY privilege_type) FROM information_schema.role_table_grants WHERE grantee='custos_app' AND table_name='tenants'")
          echo "privilegios de custos_app sobre tenants: ${P}"
          test "${P}" = "SELECT"

      # -----------------------------------------------------------------------
      # FALSADORES DEL PROPIO CI
      #
      # Historia de este bloque, porque cada condicion se gano estar aca:
      #
      # v1: aceptaba CUALQUIER exit distinto de cero. Un traceback del arnes o un
      #     fallo de PostgreSQL contaban como "el guard funciona". Reparo 2 de
      #     Sol.
      # v2: exigia el PREFIJO `ROJO CASO`. Sol probo por inyeccion que un fallo
      #     de la PREPARACION lo satisfacia; yo lo medi enumerando etiquetas y
      #     daba peor: el prefijo matcheaba CUATRO checks y solo UNO era el
      #     objetivo. Uno de los ajenos era el CONTROL POSITIVO, o sea que romper
      #     el camino LEGITIMO contaba como sabotaje exitoso.
      # v3: linea exacta + exit 1 + exactamente UN rojo. Cerraba el experimento
      #     CONTAMINADO (objetivo + fixture roto juntos).
      # v4, esta: Sol encontro TARGET-THEN-CRASH. La suite emite la etiqueta
      #     objetivo y DESPUES revienta. Una excepcion Python sale 1 y no suma
      #     linea ROJO, asi que las tres condiciones de v3 se cumplian con la
      #     suite MUERTA a mitad de camino y el control positivo sin correr.
      #     Medido contra main:
      #       A. solo el objetivo          -> aceptaba  (correcto)
      #       B. objetivo y luego crash    -> ACEPTABA  (el hueco)
      #       C. objetivo y luego exit 0   -> rechazaba
      #       D. crash sin objetivo        -> rechazaba
      #
      # LO QUE UN FALSADOR TIENE QUE COMPROBAR, y son CINCO cosas:
      #   1. exit 1 EXACTO. Ni 0 (no rompio nada) ni 2+ (murio de otra forma).
      #   2. la suite TERMINO: su linea de cierre `verdes: N | rojos: M` esta.
      #      Un crash no la imprime. Sin esto, "llego a la primera asercion" se
      #      lee igual que "corrio completo".
      #   3. la ULTIMA linea es exactamente ROJO, que es como la suite se despide.
      #   4. COHERENCIA: los rojos que la suite DECLARA en su cierre son los
      #      mismos que los rojos CONTADOS en el log. Si se contradice, el
      #      instrumento no sirve y da igual que el numero sea el esperado.
      #   5. EXACTAMENTE UN rojo, y es la LINEA COMPLETA del check objetivo con
      #      su obtenido/esperado.
      #
      # NO se fija el numero de VERDES a proposito. Hoy son 44 y eso esta medido,
      # pero seria un numero magico que rompe el CI cada vez que alguien agregue
      # un check legitimo, y un guard que se rompe por trabajo correcto se acaba
      # desactivando. Lo que se exige es COHERENCIA, que no caduca.
      # -----------------------------------------------------------------------
      - name: FALSADOR 1 - invertir el orden de decisiones DEBE romper el check D2
        run: |
          set -uo pipefail
          cp backend/api.py /tmp/api.py.bak
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("backend/api.py")
          t = p.read_text()
          viejo = '    aplicables.sort(key=_clave_decision, reverse=True)\n    ultima = aplicables[0]'
          assert t.count(viejo) == 1, "no encontre el punto a sabotear"
          # Orden INVERTIDO: vuelve a ganar la decision mas vieja, o sea el bug.
          t = t.replace(viejo, '    aplicables.sort(key=_clave_decision)\n    ultima = aplicables[0]', 1)
          p.write_text(t)
          print("sabotaje 1 aplicado: orden de decisiones invertido")
          PY
          set +e
          python3 backend/test_regresiones_hitl.py > /tmp/f1.log 2>&1
          RC=$?
          set -e
          cp /tmp/api.py.bak backend/api.py
          echo "exit del sabotaje 1: ${RC}"
          if [ "${RC}" != "1" ]; then
            echo "ROJO DEL FALSADOR: se esperaba exit 1 de aserciones. Un 0 dice que"
            echo "la suite PASO con el defecto puesto; un 2+ que murio de otra forma."
            tail -25 /tmp/f1.log
            exit 1
          fi
          # LA SUITE TIENE QUE HABER TERMINADO. Esto cierra el target-then-crash:
          # una excepcion posterior al check objetivo da exit 1 y no suma rojos,
          # asi que sin este guard se leia igual que una corrida completa.
          CIERRE=$(grep -E '^verdes: [0-9]+ \| rojos: [0-9]+$' /tmp/f1.log || true)
          if [ -z "${CIERRE}" ]; then
            echo "SUITE INCOMPLETA: no imprimio su linea de cierre, o sea que MURIO"
            echo "a mitad de camino. Los checks posteriores -- incluido el control"
            echo "positivo -- nunca corrieron, asi que el rojo no prueba que el"
            echo "defecto siga siendo detectable. Ultimas lineas:"
            tail -25 /tmp/f1.log
            exit 1
          fi
          echo "cierre de la suite: ${CIERRE}"
          ULTIMA=$(tail -n 1 /tmp/f1.log)
          if [ "${ULTIMA}" != "ROJO" ]; then
            echo "TERMINACION ANORMAL: la ultima linea es '${ULTIMA}' y no ROJO."
            tail -25 /tmp/f1.log
            exit 1
          fi
          # COHERENCIA entre lo que la suite DECLARA y lo que IMPRIMIO. El `|| true`
          # no es adorno: `grep -c` sin match imprime 0 y SALE 1, y con `bash -e`
          # eso mata el paso. Es un defecto que ya tengo documentado dos veces.
          CONTADOS=$(grep -c '^  ROJO ' /tmp/f1.log || true)
          DECLARADOS=$(echo "${CIERRE}" | sed 's/.*rojos: //')
          echo "rojos contados=${CONTADOS} declarados=${DECLARADOS} (se espera 1 y 1)"
          if [ "${CONTADOS}" != "${DECLARADOS}" ]; then
            echo "INSTRUMENTO INCOHERENTE: la suite declara ${DECLARADOS} rojos y"
            echo "escribio ${CONTADOS}. Da igual cual sea el esperado: si el propio"
            echo "instrumento se contradice, su veredicto no vale."
            exit 1
          fi
          if [ "${CONTADOS}" != "1" ]; then
            echo "EXPERIMENTO CONTAMINADO: el sabotaje mide UN defecto, asi que un"
            echo "rojo de mas significa que ademas se rompio otra cosa y este paso"
            echo "no puede atribuirle el rojo al sabotaje. Rojos emitidos:"
            grep '^  ROJO ' /tmp/f1.log || true
            exit 1
          fi
          # La LINEA COMPLETA del check que tiene que caerse, con su
          # obtenido/esperado. Sin esto, un traceback contaria como exito.
          if ! grep -Fq '  ROJO D2 EL DEFECTO: tras el rechazo la accion se BLOQUEA: obtenido 200, esperado 403' /tmp/f1.log; then
            echo "ROJO POR LA RAZON EQUIVOCADA: la suite fallo una sola vez, pero NO"
            echo "en el check D2 que este sabotaje deberia romper. Ultimas lineas:"
            tail -25 /tmp/f1.log
            exit 1
          fi
          echo "OK: corrida COMPLETA, y el sabotaje del orden rompe exactamente el check D2"

      - name: FALSADOR 2 - sacar la igualdad de caso DEBE romper el check del caso
        run: |
          set -uo pipefail
          # Este falsador nace del reparo 1 de Sol: una accion SIN case_id
          # heredaba una aprobacion atada a un caso. Si alguien saca
          # `_mismo_caso`, el check correspondiente tiene que caerse.
          cp backend/api.py /tmp/api.py.bak2
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("backend/api.py")
          t = p.read_text()
          viejo = '                  and _mismo_caso(ev)]'
          assert t.count(viejo) == 1, "no encontre el filtro de caso"
          t = t.replace(viejo, '                  ]', 1)
          p.write_text(t)
          print("sabotaje 2 aplicado: filtro de caso removido")
          PY
          set +e
          python3 backend/test_regresiones_hitl.py > /tmp/f2.log 2>&1
          RC=$?
          set -e
          cp /tmp/api.py.bak2 backend/api.py
          echo "exit del sabotaje 2: ${RC}"
          if [ "${RC}" != "1" ]; then
            echo "ROJO DEL FALSADOR: se esperaba exit 1 de aserciones, no exito ni salida anormal."
            tail -25 /tmp/f2.log
            exit 1
          fi
          # LA SUITE TIENE QUE HABER TERMINADO (target-then-crash de Sol).
          CIERRE=$(grep -E '^verdes: [0-9]+ \| rojos: [0-9]+$' /tmp/f2.log || true)
          if [ -z "${CIERRE}" ]; then
            echo "SUITE INCOMPLETA: no imprimio su linea de cierre, o sea que MURIO"
            echo "a mitad de camino. El control positivo (con el caso correcto sigue"
            echo "autorizando) nunca corrio, asi que este rojo no prueba que el"
            echo "sabotaje rompa SOLO lo que dice romper. Ultimas lineas:"
            tail -25 /tmp/f2.log
            exit 1
          fi
          echo "cierre de la suite: ${CIERRE}"
          ULTIMA=$(tail -n 1 /tmp/f2.log)
          if [ "${ULTIMA}" != "ROJO" ]; then
            echo "TERMINACION ANORMAL: la ultima linea es '${ULTIMA}' y no ROJO."
            tail -25 /tmp/f2.log
            exit 1
          fi
          CONTADOS=$(grep -c '^  ROJO ' /tmp/f2.log || true)
          DECLARADOS=$(echo "${CIERRE}" | sed 's/.*rojos: //')
          echo "rojos contados=${CONTADOS} declarados=${DECLARADOS} (se espera 1 y 1)"
          if [ "${CONTADOS}" != "${DECLARADOS}" ]; then
            echo "INSTRUMENTO INCOHERENTE: la suite declara ${DECLARADOS} rojos y"
            echo "escribio ${CONTADOS}. Su veredicto no vale."
            exit 1
          fi
          if [ "${CONTADOS}" != "1" ]; then
            echo "EXPERIMENTO CONTAMINADO: si ademas del objetivo se cayo la"
            echo "preparacion (el segundo expediente), el experimento no vale: con"
            echo "un case_id nulo el check del caso 2 manda el MISMO payload que el"
            echo "objetivo y el rojo deja de ser atribuible. Rojos emitidos:"
            grep '^  ROJO ' /tmp/f2.log || true
            exit 1
          fi
          if ! grep -Fq '  ROJO CASO una accion SIN caso NO hereda la aprobacion del caso 1: obtenido 200, esperado 403' /tmp/f2.log; then
            echo "ROJO POR LA RAZON EQUIVOCADA: la suite fallo una sola vez, pero NO"
            echo "en el check de la accion sin caso. Ultimas lineas:"
            tail -25 /tmp/f2.log
            exit 1
          fi
          echo "OK: corrida COMPLETA, y sacar la igualdad de caso rompe exactamente ese check"

      - name: el arbol quedo sin modificar
        run: |
          set -uo pipefail
          git diff --exit-code -- backend infra
