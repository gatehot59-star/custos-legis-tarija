name: tests

# POR QUE POSTGRES REAL Y NO UN MOCK: RLS es una funcion del planificador de
# PostgreSQL, que reescribe cada consulta agregando el predicado de la politica.
# Un mock de Python no ejecuta el planificador, asi que un test de RLS sobre un
# mock da verde siempre y no prueba nada.
#
# Y por que en Actions y no en la VM: la VM sirve el corpus en produccion con 2
# nucleos. Levantar Postgres ahi para un test compite con el buscador que el
# bufete va a usar. Actions es efimero y gratis en repo publico.
#
# DEFECTOS PROPIOS DE ESTE WORKFLOW, corregidos y anotados para no repetirlos:
#   E1. El sabotaje del RLS imprimio "OK: la fuga fue detectada" SIN detectar
#       ninguna: el test fallaba por mi contra-test de conteo (siembra acumulada
#       entre corridas). Un control que acierta el veredicto por la razon
#       equivocada no es un control. Ahora se exige la ETIQUETA del rojo.
#   E2. `grep 'ROJO ' archivo` sin match sale con codigo 1, y con `bash -e` eso
#       mato el paso entero. Es el mismo defecto del `grep -c` que ya tengo
#       documentado: un grep vacio no es un error del sistema.
#   E3. (2026-09-10) El falsador de plazos exigia el texto literal
#       `ROJO vencimiento habil`. La v2 de test_plazos.py renombro ese caso, asi
#       que el paso habria dado ROJO por el grep y NO por el sabotaje: otra vez
#       el veredicto correcto por la razon equivocada, ahora en el sentido
#       inverso. Un guard que depende de un texto libre es fragil por diseno.
#       Se reemplaza por ETIQUETAS estables que el test emite a proposito.
#
# TRES VECES EN DOS SESIONES un control acierta el veredicto por la razon
# equivocada (E1, los tests de vacacion judicial, y los de POR-DEPARTAMENTO).
# El patron es siempre el mismo: la asercion mira el RESULTADO y no el MECANISMO.
# Por eso cada falsador de aca exige una etiqueta que apunta al mecanismo.

on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/tests.yml"

jobs:
  plazos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: tests de plazos por materia
        working-directory: backend
        run: python3 test_plazos.py

      - name: tests del calendario judicial
        working-directory: backend
        run: python3 test_calendario.py

      - name: GUARD - ningun plazo puede declararse CONFIRMADO sin abogado
        working-directory: backend
        run: |
          set -uo pipefail
          # Puede dar rojo: si alguien pone confirmado=True en la tabla sin que un
          # abogado haya confirmado los arts. 252, 261 y 365, aca se cae.
          # Cuenta ESTRUCTURA (el valor del campo), no palabras en el archivo: un
          # grep matchearia comentarios y mis propios ecos.
          N=$(python3 -c "import plazos as P; print(sum(1 for p in P.PLAZOS.values() if p['confirmado']))")
          echo "plazos marcados como confirmados: ${N}"
          if [ "${N}" -ne 0 ]; then
            echo "ROJO: la tabla de plazos NO fue confirmada por ningun abogado."
            echo "Marcar confirmado=True sin medicion es exactamente la trampa"
            echo "que este modulo existe para evitar."
            exit 1
          fi

      - name: GUARD - todo periodo del calendario cita su fuente
        working-directory: backend
        run: |
          set -uo pipefail
          # Puede dar rojo: si alguien agrega una vacacion judicial sin decir de
          # que resolucion o circular salio, aca se cae. Una fecha sin fuente es
          # exactamente el dato que despues nadie puede verificar.
          python3 - <<'PY'
          import sys
          import calendario_judicial as C
          malos = []
          todos = ([p for p, _ in C.TARIJA_COMPLETOS]
                   + list(C.TARIJA_INCOMPLETOS)
                   + [p for p, _ in C.OTROS_DEPARTAMENTOS])
          for p in todos:
              if len(p.circular.strip()) < 25 or not p.departamento.strip():
                  malos.append(f"{p.desde} {p.departamento}: {p.circular!r}")
          print(f"periodos revisados: {len(todos)}")
          if malos:
              print("ROJO: periodos sin fuente citable:")
              for m in malos:
                  print("  " + m)
              sys.exit(1)
          print("OK: todos los periodos citan fuente")
          PY

      - name: SABOTAJE - los 9 falsadores tienen que dar el ROJO ESPERADO
        working-directory: backend
        run: |
          set -uo pipefail
          cp plazos.py plazos.ok
          cp calendario_judicial.py calendario_judicial.ok

          falsear() {
            # $1 nombre, $2 etiqueta esperada, $3 test a correr, $4 script python
            local nombre="$1" etiqueta="$2" test="$3" py="$4"
            cp plazos.ok plazos.py
            cp calendario_judicial.ok calendario_judicial.py
            # HAY QUE BORRAR EL BYTECODE. Un __pycache__ del modulo bueno hace que
            # el sabotaje NO se vea. Me paso en brain-env: restaure el fuente, el
            # md5 coincidia, y el test seguia rojo porque el .pyc saboteado
            # sobrevivio. Un cache es un instrumento contaminado.
            rm -rf __pycache__
            python3 -c "$py"
            local RC=0
            python3 "$test" > /tmp/sab.txt 2>&1 || RC=$?
            cp plazos.ok plazos.py
            cp calendario_judicial.ok calendario_judicial.py
            rm -rf __pycache__
            if [ "${RC}" -eq 0 ]; then
              echo "ROJO DEL FALSADOR [${nombre}]: el test PASO con el codigo saboteado."
              echo "  No puede dar rojo, asi que su verde no vale nada."
              return 1
            fi
            if ! grep -q "ETIQUETAS_ROJAS:.*${etiqueta}" /tmp/sab.txt; then
              echo "ROJO DEL FALSADOR [${nombre}]: fallo, pero NO por ${etiqueta}."
              echo "  El test detecta algo, y no es lo que este sabotaje rompe."
              grep 'ETIQUETAS_ROJAS' /tmp/sab.txt || echo "  (ninguna etiqueta)"
              grep '^  ROJO' /tmp/sab.txt | head -8 || true
              tail -5 /tmp/sab.txt || true
              return 1
            fi
            echo "OK  [${nombre}] -> rojo esperado ${etiqueta}"
            grep '^  ROJO' /tmp/sab.txt | head -3 || true
            return 0
          }

          FALLOS=0

          # ---- PLAZOS -------------------------------------------------------

          # 1. El bug medido hoy: si el umbral de 15 dias se desactiva, todo
          #    vuelve a contarse en habiles como en la v1, y traslado_demanda
          #    regala 15 dias.
          falsear "umbral-15-desactivado" "PLAZO-CORRIDO-90II" "test_plazos.py" '
          s=open("plazos.py").read()
          s=s.replace("UMBRAL_HABILES_CIVIL = 15","UMBRAL_HABILES_CIVIL = 999")
          open("plazos.py","w").write(s)' || FALLOS=$((FALLOS+1))

          # 2. La vacacion judicial deja de suspender (art. 126.IV LOJ).
          #    ATENCION: las 4 aserciones ORIGINALES de vacacion pasaban con este
          #    mismo sabotaje, porque la prorroga del 90.III las rescataba. Las
          #    que discriminan miran el computo dia por dia.
          falsear "vacacion-no-suspende" "VACACION-NO-CONSUME" "test_plazos.py" '
          s=open("plazos.py").read()
          s=s.replace("    susp = calendario.suspendido(fecha) if calendario else None","    susp = None")
          s=s.replace("            cuenta = not suspendido","            cuenta = True")
          open("plazos.py","w").write(s)' || FALLOS=$((FALLOS+1))

          # 3. El plazo arranca en base+1 sin buscar el dia HABIL (art. 90.I).
          #    Solo se nota en computo corrido: en habiles el sabado no cuenta
          #    igual, asi que el test de habiles NO discriminaba.
          falsear "arranque-sin-buscar-habil" "ARRANQUE-HABIL" "test_plazos.py" '
          s=open("plazos.py").read()
          s=s.replace("        if marca == \"habil\":\n            inicio = cursor\n            break","        inicio = cursor\n        break")
          open("plazos.py","w").write(s)' || FALLOS=$((FALLOS+1))

          # 4. La hora de vencimiento penal (24:00, art. 130) se iguala a la
          #    civil. Son horas de diferencia y deciden si un escrito entro.
          falsear "hora-penal-igual-a-civil" "HORA-PENAL" "test_plazos.py" '
          s=open("plazos.py").read()
          s=s.replace("HORA_VENCIMIENTO_PENAL = _dt.time(23, 59, 59)","HORA_VENCIMIENTO_PENAL = _dt.time(18, 0, 0)")
          open("plazos.py","w").write(s)' || FALLOS=$((FALLOS+1))

          # 5. El modulo declara CONFIRMADO sin circular del Tribunal
          #    Departamental. Es la mentira mas peligrosa: una fecha con cara de
          #    cierta sobre un calendario que nadie cargo.
          falsear "confirmado-sin-calendario" "SIN-CALENDARIO-NO-MEDIDO" "test_plazos.py" '
          s=open("plazos.py").read()
          s=s.replace("    estado = NO_MEDIDO if sin_cobertura else CONFIRMADO","    estado = CONFIRMADO")
          open("plazos.py","w").write(s)' || FALLOS=$((FALLOS+1))

          # ---- CALENDARIO ---------------------------------------------------

          # 6. Un periodo con el fin NO MEDIDO declara cobertura igual.
          #    Registrar no es confirmar.
          falsear "incompleto-declara-cobertura" "REGISTRAR-NO-ES-CONFIRMAR" "test_calendario.py" '
          s=open("calendario_judicial.py").read()
          s=s.replace("cal.registrar(p, cubre=False)","cal.registrar(p)")
          open("calendario_judicial.py","w").write(s)' || FALLOS=$((FALLOS+1))

          # 7. El calendario ignora el departamento. MEDIDO que importa: en 2025
          #    Potosi arranco el 8-dic y Santa Cruz el 9-dic.
          falsear "calendario-ignora-departamento" "FILTRO-DEPARTAMENTO" "test_calendario.py" '
          s=open("plazos.py").read()
          s=s.replace("            if p.departamento == self.departamento and p.contiene(f):","            if p.contiene(f):")
          open("plazos.py","w").write(s)' || FALLOS=$((FALLOS+1))

          # 8. materia_modelada acepta cualquier cosa, o sea que un contencioso
          #    administrativo se calcularia con la regla civil.
          falsear "materia-acepta-todo" "TERCER-REGIMEN" "test_calendario.py" '
          s=open("plazos.py").read()
          s=s.replace("    if n in MATERIAS_NO_MODELADAS:\n        return False, MATERIAS_NO_MODELADAS[n]\n","    return True, None\n")
          open("plazos.py","w").write(s)' || FALLOS=$((FALLOS+1))

          # 9. Se pierde la distincion entre "no fue emitido todavia" y "no lo
          #    medi". Son dos pendientes distintos y uno de los dos no es mio.
          falsear "no-distingue-no-emitido" "NO-EMITIDO" "test_calendario.py" '
          s=open("calendario_judicial.py").read()
          s=s.replace("    if anio == hoy.year and hoy.month < MES_EN_QUE_SE_FIJA[0]:","    if False:")
          open("calendario_judicial.py","w").write(s)' || FALLOS=$((FALLOS+1))

          echo "----"
          if [ "${FALLOS}" -ne 0 ]; then
            echo "FALSADORES QUE NO DISCRIMINARON: ${FALLOS} de 9"
            exit 1
          fi

          # La restauracion se VERIFICA, no se supone.
          for f in plazos calendario_judicial; do
            if ! cmp -s "${f}.py" "${f}.ok"; then
              echo "ROJO: ${f}.py quedo distinto del original tras los sabotajes"
              diff "${f}.ok" "${f}.py" | head -20 || true
              exit 1
            fi
          done
          rm -f plazos.ok calendario_judicial.ok
          python3 test_plazos.py > /dev/null
          python3 test_calendario.py > /dev/null
          echo "OK: 9/9 falsadores discriminan, fuentes restauradas y verde de nuevo"

  privacidad:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: tests de la compuerta de publicacion
        working-directory: backend
        run: python3 test_anonimizador.py

      - name: GUARD - la reserva legal no se puede vaciar
        working-directory: backend
        run: |
          set -uo pipefail
          # Puede dar rojo. Cuenta ESTRUCTURA: la longitud de las tuplas, no
          # palabras en el archivo. Si alguien borra un disparador de NNA o de
          # violencia para "publicar mas jurisprudencia", aca se cae.
          python3 - <<'PY'
          import sys
          import anonimizador as A
          faltan = []
          for clave in ("menor", "adolescente", "infante", "violacion",
                        "violencia", "feminicidio", "abuso", "victima",
                        "agresor", "trata", "tutela", "filiacion"):
              if not any(clave in p for p, _ in A.DISPARADORES_RESERVA):
                  faltan.append(clave)
          print(f"disparadores de reserva: {len(A.DISPARADORES_RESERVA)}")
          print(f"materias de reserva: {sorted(A.MATERIAS_RESERVA)}")
          if faltan:
              print("ROJO: desaparecieron disparadores de reserva legal: "
                    + ", ".join(faltan))
              sys.exit(1)
          if len(A.MATERIAS_RESERVA) < 4:
              print("ROJO: la lista de materias de reserva se encogio")
              sys.exit(1)
          print("OK: la reserva legal esta completa")
          PY

      - name: GUARD - ninguna fixture pasa a publica sin aprobacion humana
        working-directory: backend
        run: |
          set -uo pipefail
          # Este es el guard que mas importa del repo: es el bloqueador #1.
          # Si alguna de las 9 fixtures (6 reales, 3 sinteticas) sale publicable
          # sin matricula, la compuerta esta abierta.
          python3 - <<'PY'
          import sys
          import anonimizador as A
          import fixtures_reales as F
          malos = []
          for texto, materia, proc, sint, esp in F.FIXTURES:
              v = A.evaluar(texto, materia)
              if v.publicable:
                  malos.append(f"{proc} -> {v.decision.value}")
          print(f"fixtures evaluadas: {len(F.FIXTURES)}")
          if malos:
              print("ROJO: la compuerta dejo pasar sin aprobacion:")
              for m in malos:
                  print("  " + m)
              sys.exit(1)
          print("OK: ninguna fixture sale a la capa publica sin matricula")
          PY

      - name: SABOTAJE - los 6 falsadores de la compuerta
        working-directory: backend
        run: |
          set -uo pipefail
          cp anonimizador.py anonimizador.ok

          falsear() {
            local nombre="$1" etiqueta="$2" py="$3"
            cp anonimizador.ok anonimizador.py
            rm -rf __pycache__
            python3 -c "$py"
            local RC=0
            python3 test_anonimizador.py > /tmp/sab.txt 2>&1 || RC=$?
            cp anonimizador.ok anonimizador.py
            rm -rf __pycache__
            if [ "${RC}" -eq 0 ]; then
              echo "ROJO DEL FALSADOR [${nombre}]: el test PASO con la compuerta saboteada."
              return 1
            fi
            if ! grep -q "ETIQUETAS_ROJAS:.*${etiqueta}" /tmp/sab.txt; then
              echo "ROJO DEL FALSADOR [${nombre}]: fallo, pero NO por ${etiqueta}."
              grep 'ETIQUETAS_ROJAS' /tmp/sab.txt || echo "  (ninguna etiqueta)"
              grep '^  ROJO' /tmp/sab.txt | head -8 || true
              return 1
            fi
            echo "OK  [${nombre}] -> rojo esperado ${etiqueta}"
            grep '^  ROJO' /tmp/sab.txt | head -3 || true
            return 0
          }

          FALLOS=0

          # 1. La reserva legal se desactiva: las causas de NNA y violencia
          #    saldrian a la capa publica.
          falsear "reserva-legal-desactivada" "RESERVA-LEGAL" '
          s=open("anonimizador.py").read()
          s=s.replace("    for patron, razon in DISPARADORES_RESERVA:","    for patron, razon in ():")
          s=s.replace("MATERIAS_RESERVA = frozenset({\"familiar\", \"familia\", \"ninez_adolescencia\", \"nna\"})","MATERIAS_RESERVA = frozenset()")
          open("anonimizador.py","w").write(s)' || FALLOS=$((FALLOS+1))

          # 2. El extracto se publica SIN aprobacion de matricula. Es el
          #    sabotaje que reproduce el estado actual del corpus.
          falsear "extracto-sin-matricula" "CERO-FUGAS" '
          s=open("anonimizador.py").read()
          s=s.replace("    if not aprobado_por_matricula:","    if False:")
          open("anonimizador.py","w").write(s)' || FALLOS=$((FALLOS+1))

          # 3. Las senas normativas DEBILES vuelven a establecer la clase: una
          #    Sentencia Constitucional que cita el art. 130 se publica como si
          #    fuera una ley. Este es el defecto que medi en mi propia v1.
          falsear "senas-debiles-cuentan" "SENA-DEBIL" '
          s=open("anonimizador.py").read()
          s=s.replace("    fuertes = [p for p in SENAS_NORMATIVO_FUERTES if re.search(p, t, re.I)]","    fuertes = [p for p in SENAS_NORMATIVO_FUERTES + SENAS_NORMATIVO_DEBILES if re.search(p, t, re.I)]")
          open("anonimizador.py","w").write(s)' || FALLOS=$((FALLOS+1))

          # 4. El seudonimo usa las iniciales. En un juzgado de Tarija con dos
          #    salas civiles, las iniciales reidentifican.
          falsear "seudonimo-con-iniciales" "SEUDONIMO-ESTABLE" '
          s=open("anonimizador.py").read()
          s=s.replace("    return f\"[PARTE-{h[:8].upper()}]\"","    return \"[PARTE-\" + \"\".join(w[0] for w in nombre.split()).upper() + \"]\"")
          open("anonimizador.py","w").write(s)' || FALLOS=$((FALLOS+1))

          # 5. La ficha publica devuelve todo el metadato, incluido texto_crudo
          #    y parte_actora.
          falsear "ficha-devuelve-todo" "FICHA-LIMPIA" '
          s=open("anonimizador.py").read()
          s=s.replace("    ficha = {k: meta.get(k) for k in permitidos}","    ficha = dict(meta)")
          open("anonimizador.py","w").write(s)' || FALLOS=$((FALLOS+1))

          # 6. Se pierde el rol institucional: el nombre del Magistrado Relator
          #    se tapa como si fuera una parte, y la cita queda sin trazabilidad.
          #    El error en ESTA direccion no es una fuga, es destruir el producto.
          falsear "autoridad-tratada-como-parte" "AUTORIDAD-INTACTA" '
          s=open("anonimizador.py").read()
          s=s.replace("""    for p in ROL_INSTITUCIONAL:
        if re.search(p + r"\\s*$", prev, re.I):
            return "institucional"""","")
          open("anonimizador.py","w").write(s)' || FALLOS=$((FALLOS+1))

          echo "----"
          if [ "${FALLOS}" -ne 0 ]; then
            echo "FALSADORES QUE NO DISCRIMINARON: ${FALLOS} de 6"
            exit 1
          fi
          if ! cmp -s anonimizador.py anonimizador.ok; then
            echo "ROJO: anonimizador.py quedo distinto tras los sabotajes"
            diff anonimizador.ok anonimizador.py | head -20 || true
            exit 1
          fi
          rm -f anonimizador.ok
          python3 test_anonimizador.py > /dev/null
          echo "OK: 6/6 falsadores discriminan, fuente restaurado y verde de nuevo"

  rls:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: custos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/custos
      DATABASE_URL_APP: postgresql://custos_app:CAMBIAR_EN_PRODUCCION@localhost:5432/custos
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: instalar cliente
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          python3 -m pip install --quiet 'psycopg[binary]'

      - name: aplicar el esquema
        run: |
          set -uo pipefail
          psql -h localhost -U postgres -d custos -v ON_ERROR_STOP=1 -f infra/init.sql
          psql -h localhost -U postgres -d custos -c "\dt"
          psql -h localhost -U postgres -d custos -c "SELECT tablename, policyname FROM pg_policies ORDER BY tablename"

      - name: GUARD - las tablas de inquilino tienen RLS FORZADO
        run: |
          set -uo pipefail
          # Puede dar rojo: si alguien agrega una tabla con tenant_id y olvida el
          # RLS, aca se cae. ENABLE no alcanza: sin FORCE, el DUENO de la tabla
          # ignora las politicas.
          N=$(psql -h localhost -U postgres -d custos -tAc "SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relrowsecurity AND c.relforcerowsecurity")
          echo "tablas con RLS forzado: ${N}"
          if [ "${N}" -lt 5 ]; then
            echo "ROJO: se esperaban al menos 5 (users, cases, documents, cl_checkpoints, agent_runs)"
            exit 1
          fi

      - name: aislamiento entre bufetes
        working-directory: backend
        run: python3 test_rls.py

      - name: SABOTAJE - quitar el RLS de los checkpoints debe dar FUGA-CKPT
        working-directory: backend
        run: |
          set -uo pipefail
          # Reproduce el D3 de Fable: los checkpoints sin proteger.
          psql -h localhost -U postgres -d custos -c "ALTER TABLE public.cl_checkpoints DISABLE ROW LEVEL SECURITY"
          RC=0
          python3 test_rls.py > /tmp/rls_sab.txt 2>&1 || RC=$?
          psql -h localhost -U postgres -d custos -c "ALTER TABLE public.cl_checkpoints ENABLE ROW LEVEL SECURITY"
          if [ "${RC}" -eq 0 ]; then
            echo "ROJO DEL FALSADOR: el test paso SIN RLS en cl_checkpoints."
            echo "O sea que no mide la fuga del D3."
            exit 1
          fi
          # LA PARTE QUE FALTABA: exigir el rojo ESPERADO. Sin esto, el paso daba
          # verde con cualquier fallo, y eso ya me paso.
          if ! grep -q 'FUGA-CKPT' /tmp/rls_sab.txt; then
            echo "ROJO DEL FALSADOR: el test fallo, pero NO por la fuga de checkpoints."
            echo "Etiquetas que si aparecieron:"
            grep 'ETIQUETAS_ROJAS' /tmp/rls_sab.txt || echo "  (ninguna)"
            sed -n '1,60p' /tmp/rls_sab.txt
            exit 1
          fi
          echo "OK: la fuga de checkpoints fue detectada con su etiqueta:"
          grep 'FUGA-CKPT' /tmp/rls_sab.txt | head -4 || true

      - name: y verde otra vez con el RLS restaurado
        working-directory: backend
        run: python3 test_rls.py
