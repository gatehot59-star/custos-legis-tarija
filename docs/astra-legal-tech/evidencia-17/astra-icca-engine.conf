# Astra Legal Tech en astra.icca-engine.com (entra por el tunel cloudflared-corpus)
# La IP del visitante se toma de Cloudflare solo cuando la conexion llega del tunel local.
map $remote_addr $astra_ip_real {
    127.0.0.1 $http_cf_connecting_ip;
    default   $remote_addr;
}

# HTML del sitio: el navegador lo revalida siempre (no-cache) y Cloudflare no lo modifica (no-transform).
# La cuenta tambien va sin transformar: su CSP no deja correr scripts agregados en el borde.
map $uri $astra_cache {
    default       "";
    /             "no-cache, no-transform";
    /index.html   "no-cache, no-transform";
    /404.html     "no-cache, no-transform";
    ~^/cuenta/    "no-transform";
    "~^/legal-tech-(?:argentina|bolivia|brasil|chile|colombia|mexico|paraguay|peru|uruguay)/?$" "no-store";
}

# Paginas por pais: el salto borra la copia vieja que el navegador guardo de versiones anteriores.
# Hasta la v6 el HTML salia sin Cache-Control y el navegador lo daba por fresco unas 20 h sin preguntar.
map $uri $astra_limpiar {
    default "";
    "~^/legal-tech-(?:argentina|bolivia|brasil|chile|colombia|mexico|paraguay|peru|uruguay)/?$" '"cache"';
}

server {
    listen 80;
    server_name astra.icca-engine.com;
    root /var/www/astra;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    client_max_body_size 8k;
    error_page 404 /404.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control $astra_cache always;
    add_header Clear-Site-Data $astra_limpiar always;

    # Quien entre por http va a https (Cloudflare informa el esquema original).
    if ($http_x_forwarded_proto = "http") { return 301 https://$host$request_uri; }

    location = /astra { return 301 /; }
    location ^~ /astra/ { return 301 /; }
    location ^~ /corpus/ { return 302 https://150448fcc6.abacusai.cloud$request_uri; }

    # Cuenta Astra: servicio aparte (astra-cuenta.service, gunicorn en 127.0.0.1:8010).
    location = /cuenta { return 301 /cuenta/; }
    location ^~ /cuenta/ {
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $astra_ip_real;
        proxy_set_header X-Forwarded-For $astra_ip_real;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Tipografias propias, sin terceros; los nombres llevan huella, asi que la cache puede ser larga.
    location ^~ /fuentes/ { expires 365d; try_files $uri =404; }

    # Paginas por pais: la direccion limpia lleva a la ruta del sitio (#/legal-tech-<pais>).
    # El ?pais= cambia la direccion pedida: aun sin Clear-Site-Data el navegador no puede usar su copia vieja de /.
    location ~ "^/legal-tech-(argentina|bolivia|brasil|chile|colombia|mexico|paraguay|peru|uruguay)/?$" { return 302 "/?pais=$1#/legal-tech-$1"; }

    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
